<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة الأفكار - الميثاق</title><style>@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap');*{box-sizing:border-box}body{font-family:Almarai,Arial;background:#f3f6fa;color:#0b2854;margin:0;line-height:1.8}header{background:#0b2854;color:white;padding:22px}main{max-width:850px;margin:35px auto;padding:0 18px}.panel{padding:24px;background:white;border:1px solid #dce5ed;border-radius:17px;margin-bottom:16px}input,button{font:inherit;padding:10px 14px;border-radius:9px}input{border:1px solid #aebacc}button{border:0;background:#0b2854;color:white;cursor:pointer;margin:4px}button.yes{background:#147b53}button.no{background:#ae3d3d}.idea{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#68788b;font-size:13px}</style><header><h2 style="margin:0">لوحة مراجعة أفكار ميثاق الابتكار من أجل الدمج</h2><small>تُنشر الفكرة فقط بعد موافقة المشرف ويظهر اسم صاحب الفكرة بعد موافقته الصريحة وموافقة المشرف</small></header><main><div class="panel"><label>رمز الإدارة (CHARTER_ADMIN_PIN): <input type="password" id="pin" placeholder="رمز الإدارة"></label><button id="load">عرض المشاركات المعلقة</button><p class="muted">يُرسل الرمز للتحقق في كل طلب ولا يُحفظ محلياً.</p><p id="msg"></p></div><div id="items"></div></main><script>const $=x=>document.getElementById(x);async function request(url,opts={}){const r=await fetch(url,{...opts,headers:{'X-Admin-Pin':$('pin').value,'Content-Type':'application/json'}});const j=await r.json();if(!r.ok)throw Error(j.detail||'فشل الطلب');return j}async function load(){try{let d=await request('/api/admin/feedback');$('items').innerHTML='';$('msg').textContent=`عدد الأفكار بانتظار القرار: ${d.items.length}`;d.items.forEach(x=>{let c=document.createElement('div');c.className='panel';let h=document.createElement('h3');h.textContent=x.feedback;let p=document.createElement('p');p.className='idea';p.textContent=x.idea;let note=document.createElement('p');note.className='muted';note.textContent='المشارك: '+x.name+' | وافق على نشر الاسم: '+(x.publish_name?'نعم':'لا')+' | رقم المشاركة: '+x.code;let a=document.createElement('button');a.textContent='✓ الموافقة والنشر';a.className='yes';a.onclick=()=>moderate(x.id,'approved');let b=document.createElement('button');b.textContent='✕ رفض النشر';b.className='no';b.onclick=()=>moderate(x.id,'rejected');c.append(h,p,note,a,b);$('items').append(c)})}catch(e){$('msg').textContent=e.message}}async function moderate(id,status){try{await request('/api/admin/feedback/'+id,{method:'POST',body:JSON.stringify({status})});load()}catch(e){$('msg').textContent=e.message}}$('load').onclick=load;</script></html>
